
services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 8081
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3002:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
